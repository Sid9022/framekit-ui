<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F8F8F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Open-source animated React + Tailwind components with premium motion. Light and dark, accessible, and installable with one shadcn CLI command." />
    <title>Framekit UI: Animated React + Tailwind Component Library</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Framekit UI" />
    <meta property="og:title" content="Framekit UI: Animated React + Tailwind Component Library" />
    <meta property="og:description" content="Open-source, motion-rich React + Tailwind components. Copy the source or install with the shadcn CLI." />
    <!-- Site URL: src/docs/site-url.ts. scripts/prerender.mjs re-emits canonical/og:url/og:image per route. -->
    <meta property="og:url" content="https://www.framekitui.live/" />
    <link rel="canonical" href="https://www.framekitui.live/" />
    <meta property="og:image" content="https://www.framekitui.live/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.framekitui.live/og.png" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // JS is running: the prerendered SEO shell inside #root stays hidden until React replaces it (see scripts/prerender.mjs).
      document.documentElement.setAttribute('data-js', '')
      // Apply the stored / OS theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('framekit-theme')
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.classList.toggle('dark', t === 'dark')
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
